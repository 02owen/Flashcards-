<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Flashcards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Visual Flashcards</h1>
        <p>Enhance your memory with images. Add your custom cards below!</p>
    </header>

    <main>
        <!-- Form to add new flashcards -->
        <section class="form-section">
            <form id="flashcard-form">
                <div class="input-group">
                    <label>1. Select Image Source</label>
                    <div class="image-buttons-container">
                        <!-- Camera Button -->
                        <button type="button" id="camera-trigger-btn" class="source-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                            Take Photo
                        </button>
                        <!-- File/Gallery Button -->
                        <button type="button" id="file-trigger-btn" class="source-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                            Choose File
                        </button>
                    </div>
                    <!-- Hidden inputs -->
                    <input type="file" id="camera-input" accept="image/*" capture="environment" style="display: none;">
                    <input type="file" id="file-input" accept="image/*" style="display: none;">
                    <span id="selected-file-name" class="file-status">No image selected</span>
                </div>

                <div class="input-group">
                    <label for="card-word">2. Word / Translation</label>
                    <input type="text" id="card-word" placeholder="e.g., Solenoid, Ambiguous..." required autocomplete="off">
                </div>
                
                <button type="submit" id="submit-btn">Add Flashcard</button>
            </form>
        </section>

        <!-- Grid where cards will be displayed -->
        <section class="cards-section" id="cards-container">
            <!-- Cards will be injected here by JavaScript -->
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
