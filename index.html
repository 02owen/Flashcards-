<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق تدريب الكلمات الفرنسية | Vocabulary Master</title>
    <!-- Google Fonts: Tajawal -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --success: #10B981;
            --danger: #EF4444;
            --border-radius: 16px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Container & Cards */
        .app-container {
            width: 100%;
            max-width: 500px;
            position: relative;
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .app-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            background: var(--card-bg);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: var(--transition);
            color: var(--text-main);
        }

        .icon-btn:hover {
            transform: translateY(-2px);
            color: var(--primary);
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 30px;
            box-shadow: var(--shadow);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        /* Progress Bar */
        .progress-container {
            margin-bottom: 25px;
        }

        .progress-stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background-color: #E5E7EB;
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), #818CF8);
            border-radius: 999px;
            transition: width 0.4s ease;
        }

        /* Quiz Body */
        .word-badge {
            display: inline-block;
            background-color: #EEF2FF;
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .word-display {
            font-size: 2.2rem;
            font-weight: 800;
            text-align: center;
            margin: 15px 0 25px 0;
            color: var(--text-main);
            direction: ltr;
            letter-spacing: 0.5px;
        }

        .options-grid {
            display: grid;
            gap: 12px;
        }

        .option-btn {
            background-color: #F9FAFB;
            border: 2px solid #E5E7EB;
            border-radius: 12px;
            padding: 16px;
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-main);
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            width: 100%;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background-color: #EEF2FF;
        }

        .option-btn.correct {
            background-color: #D1FAE5 !important;
            border-color: var(--success) !important;
            color: #065F46 !important;
            font-weight: 700;
        }

        .option-btn.wrong {
            background-color: #FEE2E2 !important;
            border-color: var(--danger) !important;
            color: #991B1B !important;
            animation: shake 0.4s ease;
        }

        /* Result Screen */
        .result-screen {
            text-align: center;
            display: none;
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #818CF8);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
        }

        .score-circle .number {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1;
        }

        .score-circle .label {
            font-size: 0.8rem;
            opacity: 0.9;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: var(--transition);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        /* Settings Drawer/Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 25px;
            width: 90%;
            max-width: 400px;
            box-shadow: var(--shadow);
            transform: translateY(20px);
            transition: var(--transition);
        }

        .modal-overlay.active .modal-card {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #E5E7EB;
            padding-bottom: 10px;
        }

        .setting-item {
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .setting-item label {
            font-weight: 500;
            color: var(--text-main);
        }

        .setting-item input[type="number"] {
            width: 70px;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #D1D5DB;
            text-align: center;
            font-size: 1rem;
        }

        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #D1D5DB;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(22px); }

        /* Animations */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        /* Responsive UI */
        @media (max-width: 480px) {
            .card { padding: 20px; }
            .word-display { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="header-actions">
            <div class="app-title">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                <span>مُتقن الفرنسية</span>
            </div>
            <button class="icon-btn" id="openSettingsBtn" title="الإعدادات">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
        </div>

        <!-- Main Quiz Card -->
        <div class="card" id="quizCard">
            <div class="progress-container">
                <div class="progress-stats">
                    <span id="progressText">السؤال 1 من 10</span>
                    <span id="scoreText">النقاط: 0</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressBar"></div>
                </div>
            </div>

            <div style="text-align: center;">
                <span class="word-badge" id="categoryBadge">مفردات عامة</span>
                <div class="word-display" id="frenchWord">Bonjour</div>
            </div>

            <div class="options-grid" id="optionsContainer">
                <!-- Options injected by JS -->
            </div>
        </div>

        <!-- Result Screen -->
        <div class="card result-screen" id="resultCard">
            <h2>أحسنت! أكملت الاختبار 🎉</h2>
            <p style="color: var(--text-muted); margin-top: 6px;">إليك ملخص أدائك في الاختبار</p>

            <div class="score-circle">
                <span class="number" id="percentageResult">0%</span>
                <span class="label">النتيجة النهائية</span>
            </div>

            <p id="finalScoreDetails" style="font-weight: 500; font-size: 1.1rem; margin-bottom: 10px;"></p>

            <button class="btn-primary" id="restartBtn">إعادة الاختبار الآن</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 style="font-weight: 700;">إعدادات الاختبار</h3>
                <button class="icon-btn" id="closeSettingsBtn" style="width: 32px; height: 32px; box-shadow: none;">✕</button>
            </div>
            
            <div class="setting-item">
                <label for="questionCountInput">عدد الأسئلة:</label>
                <input type="number" id="questionCountInput" min="3" max="50" value="10">
            </div>

            <div class="setting-item">
                <label for="soundToggle">المؤثرات الصوتية:</label>
                <label class="switch">
                    <input type="checkbox" id="soundToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <button class="btn-primary" id="saveSettingsBtn">حفظ وتطبيق</button>
        </div>
    </div>

    <script>
        /* ==========================================================================
           1. DATABASE OF WORDS (مصفوفة الكلمات - جاهزة للتوسيع ببيانات الصور لاحقاً)
           ========================================================================== */
        const wordsDatabase = [
            { french: "Bonjour", arabic: "مرحباً / صباح الخير", type: "تحية" },
            { french: "Merci", arabic: "شكراً", type: "مفردات عامة" },
            { french: "S'il vous plaît", arabic: "من فضلك", type: "تعبير" },
            { french: "L'école", arabic: "المدرسة", type: "أسماء" },
            { french: "Manger", arabic: "يأكل", type: "أفعال" },
            { french: "Toujours", arabic: "دائماً", type: "ظروف" },
            { french: "La maison", arabic: "المنزل", type: "أسماء" },
            { french: "Comprendre", arabic: "يفهم", type: "أفعال" },
            { french: "Magnifique", arabic: "رائع / بديع", type: "صفات" },
            { french: "Aujourd'hui", arabic: "اليوم", type: "زمن" }
        ];

        /* ==========================================================================
           2. STATE MANAGEMENT & VARS
           ========================================================================== */
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let maxQuestions = 10;
        let soundEnabled = true;
        let isAnsweringBlocked = false;

        // Web Audio API Sound Effects
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (!soundEnabled) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                osc.frequency.setValueAtTime(130, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.35);
            }
        }

        /* ==========================================================================
           3. DOM ELEMENTS
           ========================================================================== */
        const quizCard = document.getElementById('quizCard');
        const resultCard = document.getElementById('resultCard');
        const frenchWordEl = document.getElementById('frenchWord');
        const categoryBadgeEl = document.getElementById('categoryBadge');
        const optionsContainer = document.getElementById('optionsContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const scoreText = document.getElementById('scoreText');
        const percentageResult = document.getElementById('percentageResult');
        const finalScoreDetails = document.getElementById('finalScoreDetails');

        // Modal Elements
        const settingsModal = document.getElementById('settingsModal');
        const openSettingsBtn = document.getElementById('openSettingsBtn');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const saveSettingsBtn = document.getElementById('saveSettingsBtn');
        const questionCountInput = document.getElementById('questionCountInput');
        const soundToggle = document.getElementById('soundToggle');
        const restartBtn = document.getElementById('restartBtn');

        /* ==========================================================================
           4. QUIZ LOGIC
           ========================================================================== */
        function startQuiz() {
            // Shuffle database & pick subset
            const shuffled = [...wordsDatabase].sort(() => 0.5 - Math.random());
            currentQuestions = shuffled.slice(0, Math.min(maxQuestions, wordsDatabase.length));
            
            currentIndex = 0;
            score = 0;
            isAnsweringBlocked = false;

            resultCard.style.display = 'none';
            quizCard.style.display = 'block';

            updateScoreDisplay();
            loadQuestion();
        }

        function loadQuestion() {
            isAnsweringBlocked = false;
            const currentItem = currentQuestions[currentIndex];

            // UI updates
            frenchWordEl.textContent = currentItem.french;
            categoryBadgeEl.textContent = currentItem.type || "مفردات";
            
            // Progress Bar
            const progressPercent = ((currentIndex) / currentQuestions.length) * 100;
            progressBar.style.width = `${progressPercent}%`;
            progressText.textContent = `السؤال ${currentIndex + 1} من ${currentQuestions.length}`;

            // Generate options (1 correct + 3 wrong)
            optionsContainer.innerHTML = '';
            const options = generateOptions(currentItem.arabic);

            options.forEach(optionText => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = optionText;
                btn.onclick = () => handleAnswer(optionText, currentItem.arabic, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function generateOptions(correctAnswer) {
            const options = [correctAnswer];
            const allArabicMeanings = wordsDatabase.map(w => w.arabic).filter(a => a !== correctAnswer);
            const shuffledMeanings = allArabicMeanings.sort(() => 0.5 - Math.random());

            // Get up to 3 distractor choices
            for (let i = 0; i < Math.min(3, shuffledMeanings.length); i++) {
                options.push(shuffledMeanings[i]);
            }

            return options.sort(() => 0.5 - Math.random());
        }

        function handleAnswer(selectedAnswer, correctAnswer, btnElement) {
            if (isAnsweringBlocked) return;
            isAnsweringBlocked = true;

            const allButtons = optionsContainer.querySelectorAll('.option-btn');

            if (selectedAnswer === correctAnswer) {
                btnElement.classList.add('correct');
                playSound('correct');
                score++;
                updateScoreDisplay();
            } else {
                btnElement.classList.add('wrong');
                playSound('wrong');
                // Highlight correct one
                allButtons.forEach(b => {
                    if (b.textContent === correctAnswer) b.classList.add('correct');
                });
            }

            // Next question delay
            setTimeout(() => {
                currentIndex++;
                if (currentIndex < currentQuestions.length) {
                    loadQuestion();
                } else {
                    showFinalResult();
                }
            }, 1200);
        }

        function updateScoreDisplay() {
            scoreText.textContent = `النقاط: ${score}`;
        }

        function showFinalResult() {
            quizCard.style.display = 'none';
            resultCard.style.display = 'block';

            const percentage = Math.round((score / currentQuestions.length) * 100);
            percentageResult.textContent = `${percentage}%`;
            finalScoreDetails.textContent = `أجبت بشكل صحيح على ${score} من أصل ${currentQuestions.length} سؤال.`;
            progressBar.style.width = `100%`;
        }

        /* ==========================================================================
           5. SETTINGS & MODAL CONTROLS
           ========================================================================== */
        openSettingsBtn.onclick = () => settingsModal.classList.add('active');
        closeSettingsBtn.onclick = () => settingsModal.classList.remove('active');

        saveSettingsBtn.onclick = () => {
            const newCount = parseInt(questionCountInput.value);
            if (newCount > 0) maxQuestions = newCount;
            soundEnabled = soundToggle.checked;
            
            settingsModal.classList.remove('active');
            startQuiz();
        };

        restartBtn.onclick = startQuiz;

        // Initialize App on Load
        window.onload = startQuiz;
    </script>
</body>
</html>
