<!DOCTYPE html>

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #1a73e8;
            font-size: 24px;
            margin-bottom: 10px;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: bold;
            color: #5f6368;
        }
        .card {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 30px 20px;
            margin-bottom: 25px;
        }
        .french-word {
            font-size: 32px;
            font-weight: bold;
            color: #202124;
            margin-bottom: 8px;
        }
        .arabic-meaning {
            font-size: 18px;
            color: #70757a;
        }
        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        button {
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-masculin {
            background-color: #1a73e8;
            color: white;
        }
        .btn-masculin:hover {
            background-color: #1557b0;
        }
        .btn-feminin {
            background-color: #e91e63;
            color: white;
        }
        .btn-feminin:hover {
            background-color: #c2185b;
        }
        .feedback {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            min-height: 27px;
        }
        .correct {
            color: #34a853;
        }
        .incorrect {
            color: #ea4335;
        }
        .next-btn {
            margin-top: 20px;
            background-color: #34a853;
            color: white;
            width: 100%;
            display: none;
        }
        .next-btn:hover {
            background-color: #2d8e47;
        }
    </style>
</head>

        <div class="french-word" id="word-display">--</div>

    </div>

    <div class="buttons">

        <button class="btn-feminin" onclick="checkAnswer('F')">مؤنث (Féminin)</button>
    </div>

    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="next-btn" onclick="nextWord()">الكلمة التالية</button>

let currentIndex = 0;
let score = 0;
let shuffledWords = [];

function shuffleArray(array) {
    return array.slice().sort(() => Math.random() - 0.5);
}

function initQuiz() {
    shuffledWords = shuffleArray(wordsDatabase);
    currentIndex = 0;
    score = 0;
    updateStats();
    loadWord();
}

function updateStats() {
    document.getElementById('score').textContent = `النقاط: ${score}`;
    document.getElementById('counter').textContent = `الكلمة: ${currentIndex + 1} / ${shuffledWords.length}`;
}

function loadWord() {
    if (currentIndex >= shuffledWords.length) {
        showFinalResult();
        return;
    }
    const current = shuffledWords[currentIndex];
    document.getElementById('word-display').textContent = current.french;
    document.getElementById('meaning-display').textContent = current.arabic;
    document.getElementById('feedback').textContent = '';
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('next-btn').style.display = 'none';
    
    const btns = document.querySelectorAll('.buttons button');
    btns.forEach(btn => btn.disabled = false);
    updateStats();
}

function checkAnswer(selectedGender) {
    const current = shuffledWords[currentIndex];
    const feedbackEl = document.getElementById('feedback');
    const btns = document.querySelectorAll('.buttons button');
    
    btns.forEach(btn => btn.disabled = true);

    const correctArticle = current.gender === 'M' ? 'Le / Un' : 'La / Une';
    
    if (selectedGender === current.gender) {
        score++;
        feedbackEl.textContent = `إجابة صحيحة! (${correctArticle} ${current.french})`;
        feedbackEl.className = 'feedback correct';
    } else {
        feedbackEl.textContent = `إجابة خاطئة! الصواب: (${correctArticle} ${current.french})`;
        feedbackEl.className = 'feedback incorrect';
    }

    document.getElementById('score').textContent = `النقاط: ${score}`;
    document.getElementById('next-btn').style.display = 'block';
}

function nextWord() {
    currentIndex++;
    loadWord();
}

function showFinalResult() {
    document.getElementById('word-display').textContent = "انتهى الاختبار!";
    document.getElementById('meaning-display').textContent = `درجتك النهائية: ${score} من ${shuffledWords.length}`;
    document.querySelector('.buttons').style.display = 'none';
    document.getElementById('feedback').textContent = '';
    document.getElementById('next-btn').style.display = 'none';
}

// تشغيل التطبيق عند التحميل
window.onload = initQuiz;
