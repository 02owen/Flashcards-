<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار المذكر والمؤنث في اللغة الفرنسية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div id="quiz-box">
        <h1>تحديد جنس الكلمة (Masculin / Féminin)</h1>
        
        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>

        <div class="card">
            <div class="word" id="word-text">...</div>
            <div class="hint" id="word-meaning"></div>
        </div>

        <div class="feedback" id="feedback"></div>

        <div class="buttons" id="options">
            <button class="btn btn-masculin" onclick="checkAnswer('m')">مذكر (Masculin)</button>
            <button class="btn btn-feminin" onclick="checkAnswer('f')">مؤنث (Féminin)</button>
        </div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">الكلمة التالية</button>
    </div>

    <div class="score-container" id="score-box">
        <div class="score-title">انتهى الاختبار! 🎉</div>
        <div class="score-val" id="score-text">0 / 0</div>
        <button class="restart-btn" style="display: block;" onclick="restartQuiz()">إعادة الاختبار</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
